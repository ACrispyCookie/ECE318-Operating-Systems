<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
  <title id="title">Project 2 scheduler comparison</title>
  <desc id="desc">Comparison of classic SJF scheduling with the modified wait-aware goodness scheduler used in Project 2.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <style>
      .title{font:800 44px Inter,Segoe UI,sans-serif;fill:#e0f2fe}.sub{font:500 23px Inter,Segoe UI,sans-serif;fill:#bfdbfe}.panel{rx:28;fill:#0f172a;stroke:#334155;stroke-width:2.5;filter:url(#shadow)}.head{font:800 30px Inter,Segoe UI,sans-serif;fill:#f8fafc}.body{font:500 23px Inter,Segoe UI,sans-serif;fill:#cbd5e1}.small{font:500 19px Inter,Segoe UI,sans-serif;fill:#94a3b8}.queue{rx:16;fill:#111827;stroke:#67e8f9;stroke-width:3}.job{rx:12;stroke-width:2.5}.short{fill:#86efac;stroke:#bbf7d0}.long{fill:#fca5a5;stroke:#fecdd3}.wait{fill:#fde68a;stroke:#fbbf24}.cpu{fill:#1d4ed8;stroke:#93c5fd;stroke-width:4}.label{font:800 17px Inter,Segoe UI,sans-serif;fill:#0f172a}.white{font:800 20px Inter,Segoe UI,sans-serif;fill:#f8fafc}.arrow{fill:#67e8f9}.warn{fill:#fb7185}.ok{fill:#86efac}.formula{font:800 25px ui-monospace,Consolas,monospace;fill:#fef3c7}.note{font:700 18px Inter,Segoe UI,sans-serif;fill:#93c5fd}
    </style>
  </defs>
  <rect width="1200" height="1120" fill="url(#bg)"/>
  <text x="60" y="74" class="title">Project 2 · scheduler comparison</text>
  <text x="62" y="118" class="sub">Classic SJF favors short CPU bursts; the modified policy adds waiting time to reduce starvation.</text>

  <g transform="translate(60,170)">
    <rect width="1080" height="405" class="panel"/>
    <text x="38" y="58" class="head">Classic SJF</text>
    <text x="38" y="100" class="body">Pick the process with the lowest expected CPU burst.</text>
    <text x="38" y="135" class="small">Interactive jobs keep winning when many short jobs arrive.</text>
    <rect x="70" y="190" width="560" height="82" class="queue"/>
    <rect x="95" y="212" width="78" height="38" class="job short"/><text x="134" y="238" text-anchor="middle" class="label">I/O</text>
    <rect x="190" y="212" width="78" height="38" class="job short"/><text x="229" y="238" text-anchor="middle" class="label">I/O</text>
    <rect x="285" y="212" width="78" height="38" class="job short"/><text x="324" y="238" text-anchor="middle" class="label">I/O</text>
    <rect x="380" y="212" width="78" height="38" class="job short"/><text x="419" y="238" text-anchor="middle" class="label">I/O</text>
    <rect x="475" y="212" width="120" height="38" class="job long"/><text x="535" y="238" text-anchor="middle" class="label">long job</text>
    <path d="M660 231 l55 -34 v68 z" class="arrow"/>
    <circle cx="810" cy="231" r="56" class="cpu"/><text x="810" y="239" text-anchor="middle" class="white">CPU</text>
    <text x="735" y="332" class="note">Long jobs can wait repeatedly.</text>
    <text x="735" y="360" class="note">Starvation risk rises under mixed load.</text>
    <circle cx="680" cy="340" r="18" class="warn"/>
  </g>

  <g transform="translate(60,640)">
    <rect width="1080" height="405" class="panel"/>
    <text x="38" y="58" class="head">Modified SJF goodness rule</text>
    <text x="38" y="100" class="body">Combine predicted burst length with accumulated ready-queue wait time.</text>
    <text x="38" y="146" class="formula">priority = short expected burst + high wait time</text>
    <rect x="70" y="215" width="560" height="82" class="queue"/>
    <rect x="95" y="237" width="78" height="38" class="job short"/><text x="134" y="263" text-anchor="middle" class="label">I/O</text>
    <rect x="190" y="237" width="78" height="38" class="job short"/><text x="229" y="263" text-anchor="middle" class="label">I/O</text>
    <rect x="285" y="237" width="78" height="38" class="job wait"/><text x="324" y="263" text-anchor="middle" class="label">wait</text>
    <rect x="380" y="237" width="78" height="38" class="job wait"/><text x="419" y="263" text-anchor="middle" class="label">wait</text>
    <rect x="475" y="237" width="120" height="38" class="job long"/><text x="535" y="263" text-anchor="middle" class="label">long job</text>
    <path d="M660 256 l55 -34 v68 z" class="arrow"/>
    <circle cx="810" cy="256" r="56" class="cpu"/><text x="810" y="264" text-anchor="middle" class="white">CPU</text>
    <text x="735" y="337" class="note">Waiting jobs gain priority over time.</text>
    <text x="735" y="365" class="note">The workload becomes fairer.</text>
    <circle cx="680" cy="344" r="18" class="ok"/>
  </g>
</svg>
